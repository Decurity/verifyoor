[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyoor"
version = "0.1.0"
description = "Verify Solidity source against EVM runtime bytecode (Etherscan/Sourcify partial-match standard)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# - pycryptodome: keccak-256 (Python's hashlib ships NIST SHA3, not Ethereum
#   keccak); util.py falls back to pysha3 / eth-hash if either is present instead.
# - evmole (https://github.com/cdump/evmole, MIT): primary source for the selector
#   set, argument types, and state mutability in `analyze` — materially more
#   accurate than a dispatcher walk + ABI guess. analyze falls back to the built-in
#   walk if evmole errors on a given input, but it's a required install.
dependencies = ["pycryptodome>=3.19", "evmole>=0.9"]

[project.urls]
Repository = "https://github.com/Decurity/verifyoor"

[project.scripts]
verifyoor = "verifyoor.cli:main"

[dependency-groups]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["verifyoor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
